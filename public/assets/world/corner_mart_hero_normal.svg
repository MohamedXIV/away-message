<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#8080ff"/>
<!-- Slightly tilted wall/floor planes -->
<polygon points="0,0 1600,0 1600,610 0,720" fill="#7f84fb"/>
<polygon points="0,720 1600,610 1600,900 0,900" fill="#8078fb"/>
<!-- Shelf faces / lips carry opposing normals so moving lights read their depth. -->
<g fill="#7489f6">
  <rect x="80" y="235" width="470" height="80"/>
  <rect x="80" y="350" width="470" height="80"/>
  <rect x="80" y="465" width="470" height="80"/>
  <rect x="530" y="260" width="360" height="85"/>
  <rect x="530" y="390" width="360" height="85"/>
  <rect x="530" y="520" width="360" height="85"/>
</g>
<g fill="#8b76f5">
  <rect x="80" y="300" width="470" height="15"/>
  <rect x="80" y="415" width="470" height="15"/>
  <rect x="80" y="530" width="470" height="15"/>
  <rect x="530" y="330" width="360" height="15"/>
  <rect x="530" y="460" width="360" height="15"/>
  <rect x="530" y="590" width="360" height="15"/>
</g>
<!-- Fridge glass and counter lean subtly toward different light directions. -->
<rect x="1005" y="135" width="315" height="505" rx="14" fill="#7287f8"/>
<rect x="1035" y="170" width="255" height="420" fill="#798cf8"/>
<polygon points="1120,665 1505,620 1555,795 1080,820" fill="#8975f4"/>
<!-- Door/window glass -->
<rect x="1415" y="140" width="140" height="410" fill="#718af8"/>
<rect x="1442" y="165" width="88" height="300" fill="#758ff8"/>
</svg>