name: One-shot lockfile repair

on:
  push:
    branches:
      - feat/modular-orion-hardware-os

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/modular-orion-hardware-os
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile with TinyBase-compatible Zod
        run: npm install zod@^4.5.4 --package-lock-only --ignore-scripts
      - name: Validate generated dependency contract
        shell: bash
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.dependencies?.zod !== '^4.5.4') throw new Error('package.json did not resolve zod ^4.5.4');
          if (lock.packages?.['']?.dependencies?.zod !== '^4.5.4') throw new Error('lock root did not resolve zod ^4.5.4');
          if (lock.packages?.['node_modules/zod']?.version !== '4.5.4') throw new Error('lock did not resolve zod 4.5.4');
          NODE
      - name: Commit repaired manifests and remove helper
        shell: bash
        run: |
          rm .github/workflows/repair-lockfile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/repair-lockfile.yml
          git diff --cached --exit-code && { echo 'Expected dependency repair diff was empty'; exit 1; } || true
          git commit -m 'chore: align Zod with TinyBase peer dependency'
          git push origin HEAD:feat/modular-orion-hardware-os
