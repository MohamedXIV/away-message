name: Issue 8 power UI boundary mutator

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: sdd/issue-8-repair
          fetch-depth: 0
      - name: Apply bounded store and desktop patch
        run: |
          echo '' | base64 -d > /tmp/issue8_patch.py
          python /tmp/issue8_patch.py
          git diff --check
      - name: Commit bounded patch
        run: |
          git config user.name 'Issue 8 verifier'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/store/useSimulationStore.ts src/desktop/DesktopShell.tsx
          git diff --cached --quiet && exit 1
          git commit -m 'feat: route desktop through pc boot lifecycle'
          git push origin HEAD:sdd/issue-8-repair
