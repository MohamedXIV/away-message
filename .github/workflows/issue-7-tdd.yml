name: Issue 7 TDD gate

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Issue 7 repair source
        uses: actions/checkout@v4
        with:
          ref: 68764341e894f29f7b7db294937fc5310265e4ec
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Atomic store transaction GREEN
        run: npx vitest run tests/unit/StorePurchase.test.ts tests/unit/SaveSlots.test.ts tests/unit/SaveRoundTrip.test.ts
