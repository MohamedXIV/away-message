name: Issue 8 TDD gate

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Issue 8 repair source
        uses: actions/checkout@v4
        with:
          ref: 4d1eb57d8335bf38bd9121586df2b8f84a3fda84
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Home setup inventory RED
        run: npx vitest run tests/unit/HomeComputerSetup.test.ts
