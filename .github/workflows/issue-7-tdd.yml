name: Issue 7 TDD gate

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Issue 7 repair source
        uses: actions/checkout@v4
        with:
          ref: 5e51826b0740ec563c9ebe6ef217c947b69f0608
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Store boundary and ecosystem GREEN
        run: npx vitest run tests/unit/SiliconSparesBoundary.test.ts tests/unit/StorePurchase.test.ts tests/unit/AdversarialEcosystemM3Stress.test.ts tests/unit/EcosystemApps.test.ts
      - name: Typecheck strict v6 runtime
        run: npx tsc --noEmit
