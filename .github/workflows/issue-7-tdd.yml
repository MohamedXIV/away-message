name: Issue 7 TDD gate

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Issue 7 repair source
        uses: actions/checkout@v4
        with:
          ref: d96c04032b5dd32e866ab0d521517bb9b47ea456
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Inventory type diagnostics
        shell: bash
        run: |
          echo '=== inventory property declarations ==='
          grep -R -n -E 'inventory\??:' src/engine src/store | head -80 || true
          echo '=== existing state.inventory access patterns ==='
          grep -R -n 'state\.inventory' src | head -80 || true
          echo '=== modal lines ==='
          nl -ba src/world/modals/SiliconSparesModal.tsx | sed -n '14,28p'
      - name: Reproduce typecheck
        run: npx tsc --noEmit
