name: Issue 8 TDD gate

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Issue 8 repair source
        uses: actions/checkout@v4
        with:
          ref: 4b71996ff8499f357f6c32f2cbaed7f652b9a235
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Power action and desktop boundary RED
        run: npx vitest run tests/unit/PcPowerAction.test.ts tests/unit/DesktopBootBoundary.test.ts
