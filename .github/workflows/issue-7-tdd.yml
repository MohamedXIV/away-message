name: Issue 8 TDD gate

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Issue 8 repair source
        uses: actions/checkout@v4
        with:
          ref: ed607cbd03500cbef84cd28ec0eeee0e6e76ecdd
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Home setup action RED
        run: npx vitest run tests/unit/HomeComputerSetup.test.ts
