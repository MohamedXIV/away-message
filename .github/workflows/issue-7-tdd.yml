name: Issue 7 TDD gate

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Issue 7 repair source
        uses: actions/checkout@v4
        with:
          ref: 74e4f61db2e841dfc0a0659b727a111151925fb1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Inventory ownership RED
        run: npx vitest run tests/unit/StorePurchase.test.ts
