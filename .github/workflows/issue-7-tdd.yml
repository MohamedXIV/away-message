name: Issue 7 TDD gate

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Issue 7 repair source
        uses: actions/checkout@v4
        with:
          ref: 3594dc604d0b60e2140d15c105aaa754c707c0e3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Inventory ownership GREEN
        run: npx vitest run tests/unit/StorePurchase.test.ts tests/unit/ComputerStateV6.test.ts tests/unit/SaveSlots.test.ts tests/unit/SaveRoundTrip.test.ts
