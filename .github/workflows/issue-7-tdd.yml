name: Issue 7 TDD gate

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Issue 7 repair source
        uses: actions/checkout@v4
        with:
          ref: b3db28ee661b22930acf89cbafc64620274ef3b3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Store catalog GREEN
        run: npx vitest run tests/unit/StoreCatalog.test.ts tests/unit/OsEngineNoOs.test.ts tests/unit/SoftwareRegistry.test.ts
