name: Issue 8 TDD gate

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Issue 8 repair source
        uses: actions/checkout@v4
        with:
          ref: 3f300d742677fb1ff97ce254d20b2e1451ffde45
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Home setup action GREEN
        run: npx vitest run tests/unit/HomeComputerSetup.test.ts tests/unit/StorePurchase.test.ts tests/unit/SaveRoundTrip.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
