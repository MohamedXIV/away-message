name: Issue 8 TDD gate

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Issue 8 repair source
        uses: actions/checkout@v4
        with:
          ref: 68f5cc7cfaab31c82687b4f613e02a430b83b29a
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Power action and desktop boundary GREEN
        run: npx vitest run tests/unit/PcPowerAction.test.ts tests/unit/DesktopBootBoundary.test.ts tests/unit/PcBootState.test.ts tests/unit/HomeComputerSetup.test.ts tests/unit/StorePurchase.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
