name: Issue 7 strict store state repair v2

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: sdd/issue-7-repair
          fetch-depth: 0
      - name: Make Zustand state explicitly strict v6
        shell: bash
        run: |
          printf '%s' '' | base64 -d | python
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "Issue 7 verifier"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/useSimulationStore.ts
          git diff --cached --check
          git commit -m "fix: type live simulation store as strict v6 state"
          git push origin HEAD:sdd/issue-7-repair
