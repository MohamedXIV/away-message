name: Inochi WASM Hookset Probe

on:
  push:
    branches:
      - feat/away-puppet-tooling
      - feat/25-character-renderer
    paths:
      - '.github/workflows/inochi-wasm-hookset-probe.yml'
      - 'scripts/probe-inochi-wasm-load.ts'
      - 'scripts/probe-inochi-wasm-draw-list.ts'
      - 'scripts/probe-inochi-wasm-slot.ts'
      - 'scripts/probe-inochi-wasm-tint.ts'
      - 'scripts/verify-inochi-wasm-exports.mjs'
      - 'src/tooling/away-puppet/InochiDrawListBridge.ts'
      - 'src/tooling/away-puppet/InochiWebModuleBootstrap.ts'
      - 'src/tooling/away-puppet/InochiWasmDiagnostics.ts'
      - 'src/tooling/away-puppet/InochiWasmRuntimeModule.ts'
      - 'src/tooling/away-puppet/InochiWebLifecycle.ts'
      - 'tests/fixtures/away-puppet/runtime-two-parameter.inp'
      - 'tests/unit/InochiWasmLoadProbe.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hookset-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Away Message
        uses: actions/checkout@v4

      - name: Checkout pinned Inochi2D
        uses: actions/checkout@v4
        with:
          repository: Inochi2D/inochi2d
          ref: ec702261dd6428141bfd0b174a015f8af872d3ed
          path: .tmp/inochi2d

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Away dependencies
        run: npm ci

      - name: Setup pinned upstream WASI D toolchain
        uses: Inochi2D/get-sdk-action@v1
        with:
          tag: v0.9.0-testing
          sdk: ldc2-wasm32-wasi

      - name: Apply isolated Away WASM build deltas
        working-directory: .tmp/inochi2d
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dub = Path('dub.sdl')
          text = dub.read_text()
          needle = 'dependency "numem" version=">=1.6.5"\n'
          replacement = needle + 'dependency "numem:hookset-wasm" version="*"\n'
          if needle not in text:
              raise SystemExit('pinned numem dependency line not found')
          dub.write_text(text.replace(needle, replacement, 1))

          cffi = Path('source/inochi2d/cffi.d')
          text = cffi.read_text()
          needle = '''in_mesh_t* in_part_get_mesh(in_part_t* self) {
              if (auto n_self = cast(Part)self)
                  return cast(in_mesh_t*)n_self.mesh;
              return null;
          }
          '''
          replacement = needle + '''
          /**
              Gets one borrowed texture attachment from a part.
              The returned pointer remains Part-owned and is for tooling proof/readback.
          */
          in_texture_t* in_part_get_texture(in_part_t* self, uint attachment) {
              if (attachment >= IN_MAX_ATTACHMENTS)
                  return null;
              if (auto n_self = cast(Part)self)
                  return cast(in_texture_t*)n_self.textures[attachment];
              return null;
          }

          /**
              Replaces one texture attachment on a part with an existing texture.
              Ownership follows normal Part semantics: the replacement is retained
              before the previous attachment is released.
          */
          bool in_part_set_texture(in_part_t* self, uint attachment, in_texture_t* texture) {
              if (attachment >= IN_MAX_ATTACHMENTS)
                  return false;
              if (auto n_self = cast(Part)self) {
                  auto next = cast(Texture)texture;
                  if (n_self.textures[attachment] is next)
                      return true;
                  if (next)
                      next.retain();
                  if (n_self.textures[attachment])
                      n_self.textures[attachment].release();
                  n_self.textures[attachment] = next;
                  return true;
              }
              return false;
          }

          /**
              Copies the Part multiply tint into caller-owned scalar outputs.
          */
          void in_part_get_tint(in_part_t* self, float* r, float* g, float* b) {
              if (auto n_self = cast(Part)self) {
                  if (r) *r = n_self.tint.x;
                  if (g) *g = n_self.tint.y;
                  if (b) *b = n_self.tint.z;
              }
          }

          /**
              Replaces the Part multiply tint. Rendering consumes this value
              through PartVars on the next draw-list build.
          */
          bool in_part_set_tint(in_part_t* self, float r, float g, float b) {
              if (auto n_self = cast(Part)self) {
                  n_self.tint.x = clamp(r, 0, 1);
                  n_self.tint.y = clamp(g, 0, 1);
                  n_self.tint.z = clamp(b, 0, 1);
                  return true;
              }
              return false;
          }
          '''
          if needle not in text:
              raise SystemExit('pinned in_part_get_mesh block not found')
          cffi.write_text(text.replace(needle, replacement, 1))

          reader = Path('modules/inp/source/inp/format/inp2/reader.d')
          text = reader.read_text()
          tag_needle = 'switch(tag & INP2_TAG_MASK) {\n        default:    return null;\n'
          tag_replacement = tag_needle + '\n        case INP2_TAG_BOOL:\n            node = DataNode(reader.readU32LE() != 0);\n            return null;\n'
          if tag_needle not in text:
              raise SystemExit('reader switch tag block not found')
          text = text.replace(tag_needle, tag_replacement, 1)

          array_needle = 'node ~= value.move();\n            }\n            return null;\n'
          array_replacement = 'node ~= value.move();\n            }\n            if (reader.readU32LE() != INP2_TAG_ARRAY_END)\n                return "Expected ARRAY_END";\n            return null;\n'
          if array_needle not in text:
              raise SystemExit('reader array loop block not found')
          text = text.replace(array_needle, array_replacement, 1)

          obj_needle = 'nu_freea(key);\n                }\n            }\n            return null;\n'
          obj_replacement = 'nu_freea(key);\n                }\n            }\n            if (reader.readU32LE() != INP2_TAG_OBJECT_END)\n                return "Expected OBJECT_END";\n            return null;\n'
          if obj_needle not in text:
              raise SystemExit('reader object loop block not found')
          text = text.replace(obj_needle, obj_replacement, 1)
          reader.write_text(text)

          serde = Path('source/inochi2d/core/serde.d')
          text = serde.read_text()
          vec_import_needle = 'import inochi2d.core.math;\n'
          vec_import_replacement = vec_import_needle + '    import numath.vector : NumathVector = VectorImpl;\n'
          if vec_import_needle not in text:
              raise SystemExit('serde math import not found')
          text = text.replace(vec_import_needle, vec_import_replacement, 1)

          vec_branch_needle = '} else static if (is(T == VectorImpl!(VT, Args), VT, Args...)) {'
          vec_branch_replacement = '''} else static if (is(T == NumathVector!(VT, dims), VT, int dims)) {
        if (!data.isArray)
            return;

        foreach (i, ref value; data.array) {
            if (i >= dims)
                break;

            destination.data[i] = value.deserialize!(VT, ST)(state);
        }
    } else static if (is(T == VectorImpl!(VT, Args), VT, Args...)) {'''
          if vec_branch_needle not in text:
              raise SystemExit('serde VectorImpl branch not found')
          text = text.replace(vec_branch_needle, vec_branch_replacement, 1)

          old_serde_init = '''    } else static if (isSerializable!T) {
        static if (is(typeof((ref DataNode object) { T.init.serialize(object); }))) {
            DataNode result;
            toSerialize.serialize(result);
            return result;
        } else static if (is(T : ISerializable)) {
            DataNode result;
            toSerialize.onSerialize(result);
            return result;
        } else static if (is(typeof((ref DataNode object) { T.init.onSerialize(object); }))) {
            DataNode result;
            toSerialize.onSerialize(result);
            return result;'''
          new_serde_init = '''    } else static if (isSerializable!T) {
        static if (is(typeof((ref DataNode object) { T.init.serialize(object); }))) {
            DataNode result = DataNode.createObject();
            toSerialize.serialize(result);
            return result;
        } else static if (is(T : ISerializable)) {
            DataNode result = DataNode.createObject();
            toSerialize.onSerialize(result);
            return result;
        } else static if (is(typeof((ref DataNode object) { T.init.onSerialize(object); }))) {
            DataNode result = DataNode.createObject();
            toSerialize.onSerialize(result);
            return result;'''
          if old_serde_init not in text:
              raise SystemExit('serde serialize result init not found')
          text = text.replace(old_serde_init, new_serde_init, 1)
          serde.write_text(text)

          param1d = Path('source/inochi2d/param/parameters/param1d.d')
          text = param1d.read_text()
          p1_needle = 'super.onSerialize(object);\n'
          p1_replacement = p1_needle + '        object["type"] = "1d";\n'
          if p1_needle not in text:
              raise SystemExit('param1d onSerialize not found')
          param1d.write_text(text.replace(p1_needle, p1_replacement, 1))

          param2d = Path('source/inochi2d/param/parameters/param2d.d')
          text = param2d.read_text()
          p2_needle = 'super.onSerialize(object);\n'
          p2_replacement = p2_needle + '        object["type"] = "2d";\n'
          if p2_needle not in text:
              raise SystemExit('param2d onSerialize not found')
          param2d.write_text(text.replace(p2_needle, p2_replacement, 1))
          PY
          git diff -- dub.sdl source/inochi2d/cffi.d modules/inp/source/inp/format/inp2/reader.d source/inochi2d/core/serde.d source/inochi2d/param/parameters/param1d.d source/inochi2d/param/parameters/param2d.d

      - name: Build candidate WASM
        working-directory: .tmp/inochi2d
        run: dub build --compiler=ldc2 --config=wasm --arch=wasm32-wasip2 --build=release

      - name: Locate candidate WASM
        id: wasm
        shell: bash
        run: |
          WASM="$(find .tmp/inochi2d/out -type f -name '*.wasm' -print -quit)"
          test -n "$WASM"
          echo "path=$WASM" >> "$GITHUB_OUTPUT"
          sha256sum "$WASM"

      - name: Require Away runtime exports on candidate WASM
        run: node scripts/verify-inochi-wasm-exports.mjs '${{ steps.wasm.outputs.path }}'

      - name: Retain exact candidate WASM and runtime fixture for diagnostic verification
        uses: actions/upload-artifact@v4
        with:
          name: inochi2d-hookset-diagnostic-${{ github.sha }}
          path: |
            ${{ steps.wasm.outputs.path }}
            tests/fixtures/away-puppet/runtime-two-parameter.inp
          if-no-files-found: error
          retention-days: 3

      - name: Probe tiny upstream fixture through candidate allocator
        run: npx tsx scripts/probe-inochi-wasm-load.ts '${{ steps.wasm.outputs.path }}' --allow-candidate-wasm

      - name: Probe full upstream Ada inventory
        run: npx tsx scripts/probe-inochi-wasm-load.ts '${{ steps.wasm.outputs.path }}' --fixture .tmp/inochi2d/examples/ada-static.inx --allow-candidate-wasm

      - name: Prove deterministic dispose/reload on upstream Ada
        run: npx tsx scripts/probe-inochi-wasm-load.ts '${{ steps.wasm.outputs.path }}' --fixture .tmp/inochi2d/examples/ada-static.inx --lifecycle-proof --allow-candidate-wasm

      - name: Prove copied renderer draw-list data on upstream Ada
        run: npx tsx scripts/probe-inochi-wasm-draw-list.ts '${{ steps.wasm.outputs.path }}' .tmp/inochi2d/examples/ada-static.inx

      - name: Prove real part texture swap and restore on upstream Ada
        run: npx tsx scripts/probe-inochi-wasm-slot.ts '${{ steps.wasm.outputs.path }}' .tmp/inochi2d/examples/ada-static.inx

      - name: Prove real part tint swap and restore on upstream Ada
        run: npx tsx scripts/probe-inochi-wasm-tint.ts '${{ steps.wasm.outputs.path }}' .tmp/inochi2d/examples/ada-static.inx

      - name: Verify checked-in runtime puppet fixture digest
        shell: bash
        run: |
          EXPECTED_SHA="67f1089d71f50ebf7863756a18ed1664f57006e457b97cd10ebd534c0522d883"
          ACTUAL_SHA="$(sha256sum tests/fixtures/away-puppet/runtime-two-parameter.inp | awk '{print $1}')"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Fixture SHA mismatch: expected $EXPECTED_SHA, got $ACTUAL_SHA" >&2
            exit 1
          fi
          echo "Verified runtime fixture SHA-256: $ACTUAL_SHA"

      - name: Prove runtime mutation and deterministic reload on checked-in puppet
        run: npx tsx scripts/probe-inochi-wasm-load.ts '${{ steps.wasm.outputs.path }}' --fixture tests/fixtures/away-puppet/runtime-two-parameter.inp --runtime-proof --allow-candidate-wasm