name: Inochi WASM Hookset Probe

on:
  push:
    branches:
      - feat/away-puppet-tooling
    paths:
      - '.github/workflows/inochi-wasm-hookset-probe.yml'
      - 'scripts/probe-inochi-wasm-load.ts'
      - 'src/tooling/away-puppet/InochiWebModuleBootstrap.ts'
      - 'tests/unit/InochiWasmLoadProbe.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hookset-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Away Message
        uses: actions/checkout@v4

      - name: Checkout pinned Inochi2D
        uses: actions/checkout@v4
        with:
          repository: Inochi2D/inochi2d
          ref: ec702261dd6428141bfd0b174a015f8af872d3ed
          path: .tmp/inochi2d

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Away dependencies
        run: npm ci

      - name: Setup pinned upstream WASI D toolchain
        uses: Inochi2D/get-sdk-action@v1
        with:
          tag: v0.9.0-testing
          sdk: ldc2-wasm32-wasi

      - name: Add Numem WASM hookset only
        working-directory: .tmp/inochi2d
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('dub.sdl')
          text = path.read_text()
          needle = 'dependency "numem" version=">=1.6.5"\n'
          replacement = needle + 'dependency "numem:hookset-wasm" version="*"\n'
          if needle not in text:
              raise SystemExit('pinned numem dependency line not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          git diff -- dub.sdl

      - name: Build candidate WASM
        working-directory: .tmp/inochi2d
        run: dub build --compiler=ldc2 --config=wasm --arch=wasm32-wasip2 --build=release

      - name: Locate candidate WASM
        id: wasm
        shell: bash
        run: |
          WASM="$(find .tmp/inochi2d/out -type f -name '*.wasm' -print -quit)"
          test -n "$WASM"
          echo "path=$WASM" >> "$GITHUB_OUTPUT"
          sha256sum "$WASM"

      - name: Probe tiny upstream fixture through candidate allocator
        run: npx tsx scripts/probe-inochi-wasm-load.ts '${{ steps.wasm.outputs.path }}' --allow-candidate-wasm

      - name: Apply scratchpad-count diagnostic only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/probe-inochi-wasm-load.ts')
          text = path.read_text()
          old = '''function withCountPointer<T>(api: InochiWasmExports, read: (countPtr: number) => T): { value: T; count: number } {
            const countPtr = allocatePuppetInputOrThrow(api, 4);
            try {
              new DataView(api.memory.buffer).setUint32(countPtr, 0, true);
              const value = read(countPtr);
              return { value, count: new DataView(api.memory.buffer).getUint32(countPtr, true) };
            } finally {
              api.nu_free(countPtr);
            }
          }'''.replace('          ', '')
          new = '''function withCountPointer<T>(api: InochiWasmExports, read: (countPtr: number) => T): { value: T; count: number } {
            const sharedCountPtr = Number((globalThis as { __inochiProbeScratchpadPointer?: number }).__inochiProbeScratchpadPointer ?? 0);
            const countPtr = sharedCountPtr || allocatePuppetInputOrThrow(api, 4);
            const ownsCountPtr = sharedCountPtr === 0;
            try {
              new DataView(api.memory.buffer).setUint32(countPtr, 0, true);
              const value = read(countPtr);
              return { value, count: new DataView(api.memory.buffer).getUint32(countPtr, true) };
            } finally {
              if (ownsCountPtr) api.nu_free(countPtr);
            }
          }'''.replace('          ', '')
          if old not in text:
              raise SystemExit('withCountPointer block not found')
          text = text.replace(old, new, 1)
          needle = '    scratchpad = bootstrapInochiWebModule(api).scratchpad;\n'
          replacement = needle + '    (globalThis as { __inochiProbeScratchpadPointer?: number }).__inochiProbeScratchpadPointer = scratchpad.pointer;\n'
          if needle not in text:
              raise SystemExit('bootstrap assignment not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          git diff -- scripts/probe-inochi-wasm-load.ts

      - name: Test full upstream Ada parameter reads with shared scratchpad
        run: npx tsx scripts/probe-inochi-wasm-load.ts '${{ steps.wasm.outputs.path }}' --fixture .tmp/inochi2d/examples/ada-static.inx --parameter-read-proof --allow-candidate-wasm
