name: Inochi WASM Hookset Probe

on:
  push:
    branches:
      - feat/away-puppet-tooling
    paths:
      - '.github/workflows/inochi-wasm-hookset-probe.yml'
      - 'scripts/probe-inochi-wasm-load.ts'
      - 'src/tooling/away-puppet/InochiWebModuleBootstrap.ts'
      - 'tests/unit/InochiWasmLoadProbe.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hookset-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Away Message
        uses: actions/checkout@v4

      - name: Checkout pinned Inochi2D
        uses: actions/checkout@v4
        with:
          repository: Inochi2D/inochi2d
          ref: ec702261dd6428141bfd0b174a015f8af872d3ed
          path: .tmp/inochi2d

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Away dependencies
        run: npm ci

      - name: Setup pinned upstream WASI D toolchain
        uses: Inochi2D/get-sdk-action@v1
        with:
          tag: v0.9.0-testing
          sdk: ldc2-wasm32-wasi

      - name: Add Numem WASM hookset only
        working-directory: .tmp/inochi2d
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('dub.sdl')
          text = path.read_text()
          needle = 'dependency "numem" version=">=1.6.5"\n'
          replacement = needle + 'dependency "numem:hookset-wasm" version="*"\n'
          if needle not in text:
              raise SystemExit('pinned numem dependency line not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          git diff -- dub.sdl

      - name: Build candidate WASM
        working-directory: .tmp/inochi2d
        run: dub build --compiler=ldc2 --config=wasm --arch=wasm32-wasip2 --build=release

      - name: Locate candidate WASM
        id: wasm
        shell: bash
        run: |
          WASM="$(find .tmp/inochi2d/out -type f -name '*.wasm' -print -quit)"
          test -n "$WASM"
          echo "path=$WASM" >> "$GITHUB_OUTPUT"
          sha256sum "$WASM"

      - name: Probe tiny upstream fixture through candidate allocator
        run: npx tsx scripts/probe-inochi-wasm-load.ts '${{ steps.wasm.outputs.path }}' --allow-candidate-wasm

      - name: Instrument parameter-count stability by inventory stage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/probe-inochi-wasm-load.ts')
          text = path.read_text()
          start = text.index('function proveParameterReads(api: InochiWasmExports, puppetPtr: number): ParameterReadProof {')
          end = text.index('\nfunction mutateTwoParameters', start)
          diagnostic = '''function proveParameterReads(api: InochiWasmExports, puppetPtr: number): ParameterReadProof {
            const counts: Array<{ stage: string; count: number }> = [];
            const capture = (stage: string): { count: number; pointers: number[] } => {
              const current = parameterPointers(api, puppetPtr);
              counts.push({ stage, count: current.count });
              return current;
            };
            const initial = capture('initial');
            readWasmCString(api.memory, Number(api.in_puppet_get_name(puppetPtr)));
            readWasmCString(api.memory, Number(api.in_puppet_get_author(puppetPtr)));
            capture('after-metadata');
            initial.pointers.forEach((parameterPtr) => readWasmCString(api.memory, Number(api.in_parameter_get_name(parameterPtr))));
            capture('after-parameter-names');
            const rootPtr = Number(api.in_puppet_get_root_node(puppetPtr));
            capture('after-root-lookup');
            if (!rootPtr) throw new Error(`parameter stability diagnostic: ${JSON.stringify(counts)}; null root`);
            enumerateNodes(api, rootPtr);
            capture('after-node-traversal');
            throw new Error(`parameter stability diagnostic: ${JSON.stringify(counts)}`);
          }
          '''.replace('          ', '')
          path.write_text(text[:start] + diagnostic + text[end:])
          PY
          git diff -- scripts/probe-inochi-wasm-load.ts

      - name: Diagnose full upstream Ada parameter inventory stability
        run: npx tsx scripts/probe-inochi-wasm-load.ts '${{ steps.wasm.outputs.path }}' --fixture .tmp/inochi2d/examples/ada-static.inx --parameter-read-proof --allow-candidate-wasm
