name: Issue 7 migrate stale hardware OS reads

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: sdd/issue-7-repair
          fetch-depth: 0
      - name: Move stale OS reads to OsEngine state
        shell: bash
        run: |
          printf '%s' '' | base64 -d | python
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "Issue 7 verifier"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps/photobox/PhotoBoxApp.tsx src/apps/pulse/components/EmoticonPalette.tsx src/apps/pulse/components/PulseNotificationToast.tsx src/apps/pulse/components/PulseRoomWindow.tsx src/internet/sites/OrionSoftSite.tsx src/internet/sites/TechMartSite.tsx src/world/Day14ResolutionModal.tsx tests/unit/AdversarialEcosystemM3Stress.test.ts tests/unit/EcosystemApps.test.ts
          git diff --cached --check
          git commit -m "refactor: read operating system from OsEngine state"
          git push origin HEAD:sdd/issue-7-repair
