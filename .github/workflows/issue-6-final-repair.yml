name: Issue 6 final regression repair

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: sdd/issue-6-repair
          fetch-depth: 0
      - name: Apply bounded final repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:180]!r}')
              p.write_text(text.replace(old, new, count))

          # Typecheck: remove obsolete OS type import after OsEngine became authority.
          rep('tests/integration/AdversarialM1Stress.test.ts',
              "import type { OsVersion } from '../../src/engine/types';\n",
              "")

          # Historical Character Lives coverage must accept the now-current v6 and refuse only future formats.
          rep('tests/unit/CharacterLives.test.ts',
              "    expect(checkSaveCompatibility({ version: 6, snapshot: {} } as any).status).toBe('refused');",
              "    expect(checkSaveCompatibility({ version: SAVE_FORMAT_VERSION, snapshot: {} } as any).status).toBe('ok');\n    expect(checkSaveCompatibility({ version: SAVE_FORMAT_VERSION + 1, snapshot: {} } as any).status).toBe('refused');")

          # schema.ts intentionally remains transitional for historical saves; optional canonical roots are asserted safely.
          rep('tests/unit/SaveSlots.test.ts',
              "    expect(record?.snapshot?.computer.assembled).toBe(false);\n    expect(record?.snapshot?.os.currentOsId).toBeNull();",
              "    expect(record?.snapshot?.computer?.assembled).toBe(false);\n    expect(record?.snapshot?.os?.currentOsId).toBeNull();")

          # Explicit physical-network fixture for tests that actually advance downloads.
          rep('tests/unit/UnifiedFileSystem.test.ts',
              "import { SimulationEngine } from '../../src/engine/SimulationEngine';\n",
              "import { SimulationEngine } from '../../src/engine/SimulationEngine';\nimport { createScrapYardBundle } from '../../src/engine/hardware/catalog';\nimport { legacyModularToCanonical } from '../../src/engine/hardware/state';\n\nfunction makeNetworkedEngine(): SimulationEngine {\n  const canonical = legacyModularToCanonical(createScrapYardBundle());\n  return new SimulationEngine({\n    computer: canonical.computer,\n    display: canonical.display,\n  } as any);\n}\n")
          rep('tests/unit/UnifiedFileSystem.test.ts',
              "  it('completes download and creates VFS file in C:/Downloads', () => {\n    const engine = new SimulationEngine();",
              "  it('completes download and creates VFS file in C:/Downloads', () => {\n    const engine = makeNetworkedEngine();")

          rep('tests/unit/AdversarialM1Stress.test.ts',
              "import { SimulationEngine } from '../../src/engine/SimulationEngine';\n",
              "import { SimulationEngine } from '../../src/engine/SimulationEngine';\nimport { createScrapYardBundle } from '../../src/engine/hardware/catalog';\nimport { legacyModularToCanonical } from '../../src/engine/hardware/state';\n\nfunction makeNetworkedEngine(): SimulationEngine {\n  const canonical = legacyModularToCanonical(createScrapYardBundle());\n  return new SimulationEngine({\n    computer: canonical.computer,\n    display: canonical.display,\n  } as any);\n}\n")
          rep('tests/unit/AdversarialM1Stress.test.ts',
              "      const sim = new SimulationEngine();\n\n      expect(sim.getState().time.day).toBe(1);",
              "      const sim = makeNetworkedEngine();\n\n      expect(sim.getState().time.day).toBe(1);")

          rep('tests/unit/WorldScenes.test.ts',
              "import { SimulationEngine } from '../../src/engine/SimulationEngine';\n",
              "import { SimulationEngine } from '../../src/engine/SimulationEngine';\nimport { createScrapYardBundle } from '../../src/engine/hardware/catalog';\nimport { legacyModularToCanonical } from '../../src/engine/hardware/state';\n\nfunction makeNetworkedEngine(): SimulationEngine {\n  const canonical = legacyModularToCanonical(createScrapYardBundle());\n  return new SimulationEngine({\n    computer: canonical.computer,\n    display: canonical.display,\n  } as any);\n}\n")
          rep('tests/unit/WorldScenes.test.ts',
              "    it('advances background downloads authentically when stepping away to room and making tea', () => {\n      // Start download",
              "    it('advances background downloads authentically when stepping away to room and making tea', () => {\n      engine = makeNetworkedEngine();\n\n      // Start download")
          PY
      - name: Commit bounded repairs
        shell: bash
        run: |
          git config user.name "Issue 6 verifier"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git diff --cached --check
          git commit -m "test: make physical network fixtures explicit in v6"
          git push origin HEAD:sdd/issue-6-repair
