name: Issue 7 exact SHA verification

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: read

jobs:
  exact-gates:
    name: Issue 7 exact SHA gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Issue 7 candidate
        uses: actions/checkout@v4
        with:
          ref: 5e51826b0740ec563c9ebe6ef217c947b69f0608
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Focused Issue 7 gate
        run: >-
          npx vitest run
          tests/unit/StoreCatalog.test.ts
          tests/unit/StorePurchase.test.ts
          tests/unit/ComputerStateV6.test.ts
          tests/unit/SaveSlots.test.ts
          tests/unit/SaveRoundTrip.test.ts
          tests/unit/OsEngineNoOs.test.ts
          tests/unit/SoftwareRegistry.test.ts
          tests/unit/SiliconSparesBoundary.test.ts
          tests/unit/EcosystemApps.test.ts
          tests/unit/AdversarialEcosystemM3Stress.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  exact-full-suite:
    name: Issue 7 exact SHA full suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Issue 7 candidate
        uses: actions/checkout@v4
        with:
          ref: 5e51826b0740ec563c9ebe6ef217c947b69f0608
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Full test suite
        run: npm run test

  baseline-full-suite:
    name: Pre-Issue-7 baseline full suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pre-Issue-7 feature head
        uses: actions/checkout@v4
        with:
          ref: f5cc2c3cc6e873e424a96e5cef41bd5820e9cfd1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Full test suite baseline
        run: npm run test
