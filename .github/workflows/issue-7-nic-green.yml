name: Issue 7 NIC catalog repair

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: sdd/issue-7-repair
          fetch-depth: 0
      - name: Add missing physical NIC definition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/engine/hardware/catalog.ts')
          text = p.read_text()
          old = "  [scrapYardPhysical.networkCard.id]: { id: scrapYardPhysical.networkCard.id, kind: 'hardware', componentKind: 'network', component: { ...scrapYardPhysical.networkCard } },\n  [scrapYardPhysical.monitor.id]:"
          new = "  [scrapYardPhysical.networkCard.id]: { id: scrapYardPhysical.networkCard.id, kind: 'hardware', componentKind: 'network', component: { ...scrapYardPhysical.networkCard } },\n  [STARTER_ETHERNET.id]: { id: STARTER_ETHERNET.id, kind: 'hardware', componentKind: 'network', component: { ...STARTER_ETHERNET } },\n  [scrapYardPhysical.monitor.id]:"
          if old not in text:
              raise SystemExit('expected network catalog insertion point missing')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "Issue 7 verifier"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/hardware/catalog.ts
          git diff --cached --check
          git commit -m "fix: register fast ethernet physical item"
          git push origin HEAD:sdd/issue-7-repair
