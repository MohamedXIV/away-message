name: Issue 7 strict store state repair

on:
  push:
    branches:
      - sdd/issue-6-verifier

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: sdd/issue-7-repair
          fetch-depth: 0
      - name: Make Zustand state explicitly strict v6
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/store/useSimulationStore.ts')
          text = p.read_text()
          old = "  SimulationState,\n  SimulationAction,"
          new = "  StrictSimulationState,\n  SimulationAction,"
          if old not in text:
              raise SystemExit('missing SimulationState import marker')
          text = text.replace(old, new, 1)
          old = "  state: SimulationState;"
          new = "  state: StrictSimulationState;"
          if old not in text:
              raise SystemExit('missing store state marker')
          text = text.replace(old, new, 1)
          old = """      unsubscribeEngine = engineInstance.subscribe((newState) => {
        set({
          state: newState,
          isPaused: engineInstance.clock.isPaused(),
          activeView: newState.activeView,
        });
      });"""
          new = """      unsubscribeEngine = engineInstance.subscribe(() => {
        const newState = engineInstance.getState();
        set({
          state: newState,
          isPaused: engineInstance.clock.isPaused(),
          activeView: newState.activeView,
        });
      });"""
          if old not in text:
              raise SystemExit('missing subscription marker')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "Issue 7 verifier"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/useSimulationStore.ts
          git diff --cached --check
          git commit -m "fix: type live simulation store as strict v6 state"
          git push origin HEAD:sdd/issue-7-repair
