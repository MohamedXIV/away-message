name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - feat/modular-orion-hardware-os
      - chore/30-pr-verification-ci
      - fix/30-exact-head-checkout

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect content check
        id: scripts
        shell: bash
        run: |
          node -e "const p=require('./package.json'); console.log('has_content_check=' + Boolean(p.scripts && p.scripts['content:check']))" >> "$GITHUB_OUTPUT"

      - name: Verify generated content
        if: steps.scripts.outputs.has_content_check == 'true'
        run: npm run content:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify baseline guard
        run: node scripts/verify-vitest-baseline.mjs --self-test

      - name: Test
        run: node scripts/verify-vitest-baseline.mjs

      # Opt-in only: benchmark branches deliberately pay this cost.
      # Ordinary PRs do not spend extra Actions minutes on performance sampling.
      - name: Simulation benchmark baseline
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'perf/sim-')
        run: npm run bench:simulation

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser living-world smoke
        run: npx playwright test tests/e2e/tier1_features/07_RoomViewAndInteractables.spec.ts tests/e2e/tier4_scenarios/ScenarioF_LivingWorldGate.spec.ts
