name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - feat/modular-orion-hardware-os
      - chore/30-pr-verification-ci
      - fix/30-exact-head-checkout

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect content check
        id: scripts
        shell: bash
        run: |
          node -e "const p=require('./package.json'); console.log('has_content_check=' + Boolean(p.scripts && p.scripts['content:check']))" >> "$GITHUB_OUTPUT"

      - name: Verify generated content
        if: steps.scripts.outputs.has_content_check == 'true'
        run: npm run content:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify baseline guard
        run: node scripts/verify-vitest-baseline.mjs --self-test

      - name: Test
        run: node scripts/verify-vitest-baseline.mjs

      # #171 clean cutover: sample the exact checked-out PR head before
      # accepting the replacement kernel. Other PRs are unaffected.
      - name: Benchmark composed simulation (20 / 100 / 250 / 500 actors)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'refactor/171-clean-simulation-kernel'
        env:
          SIM_BENCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run bench:simulation

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser living-world smoke
        run: npx playwright test tests/e2e/tier1_features/07_RoomViewAndInteractables.spec.ts tests/e2e/tier4_scenarios/ScenarioF_LivingWorldGate.spec.ts

      # #172: real mounted React Pulse paging and full-log export, not unit-only.
      - name: Browser Pulse bounded paging gate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/172-bounded-publication'
        run: npx playwright test tests/e2e/tier4_scenarios/ScenarioG_PulsePaging.spec.ts
